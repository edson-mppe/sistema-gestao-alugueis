name: Daily Sync

on:
  schedule:
    # 07:00 UTC corresponds to 04:00 Brasilia Time (Standard Time)
    - cron: '0 7 * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials file
        env:
          # You must add this secret in your Repo Settings -> Secrets and variables -> Actions
          GCP_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          # Creates the credentials.json file expected by src/config.py
          echo "$GCP_JSON" > credentials.json

      - name: Run synchronization
        run: python sinccronizacao.py
